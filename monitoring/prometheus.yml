global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert.rules

scrape_configs:

  # ── Nginx metrics ──────────────────────────────────
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # ── API metrics (Node.js Express) ─────────────────
  - job_name: "api"
    static_configs:
      - targets: ["api:4000"]
    metrics_path: /metrics

  # ── Redis metrics ──────────────────────────────────
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # NODE
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]