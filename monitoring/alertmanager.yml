global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "alert@${DOMAIN}"
  smtp_auth_username: "${ALERT_EMAIL}"
  smtp_auth_password: "${ALERT_EMAIL_PASSWORD}"
  smtp_require_tls: true

route:
  receiver: "email"
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "email"
    email_configs:
      - to: "${ALERT_EMAIL}"
        subject: "[portomoran] {{ .GroupLabels.alertname }}"
        body: |
          {{ range .Alerts }}
          Alert   : {{ .Annotations.summary }}
          Detail  : {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Time    : {{ .StartsAt }}
          {{ end }}
