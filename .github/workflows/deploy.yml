name: CI/CD — portomoran

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: moran2-cyber/portomoran

jobs:

  build:
    name: 🐳 Build & Push Image
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    outputs:
      sha_short: ${{ steps.sha.outputs.sha_short }}

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Ambil short SHA
        id: sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: 🚀 Deploy to Production
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy
        run: |
          cd /opt/portomoran
          git pull origin main

          echo ${{ secrets.GITHUB_TOKEN }} | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ needs.build.outputs.sha_short }}/" .env

          docker compose -f docker-compose.yml \
                         -f docker-compose.prod.yml \
                         pull app

          docker compose -f docker-compose.yml \
                         -f docker-compose.prod.yml \
                         up -d --no-deps app

          docker image prune -f

          echo "✅ Deploy ${{ needs.build.outputs.sha_short }} selesai — $(date -u)"

      - name: Health Check
        run: |
          sleep 10
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://moran-porto.my.id/health)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check gagal! HTTP $STATUS"
            exit 1
          fi
          echo "✅ Website sehat — HTTP $STATUS"