server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1000;

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 6M;
        add_header Cache-Control "public";
    }

    # HTML tidak di-cache
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Metrics untuk Prometheus
    location /stub_status {
        stub_status on;
        allow 127.0.0.1;
        allow 172.0.0.0/8;
        deny all;
        access_log off;
    }
}
