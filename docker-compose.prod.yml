services:

  app:
    ports:
      - "127.0.0.1:8080:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    ports:
      - "127.0.0.1:4000:4000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    # Tidak expose ke publik — hanya internal Docker network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    # Tidak expose ke publik — hanya internal Docker network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  prometheus:
    # Expose ke semua interface supaya bisa diakses via IP:9090
    ports:
      - "9090:9090"

  grafana:
    # Expose ke semua interface supaya bisa diakses via IP:3000
    ports:
      - "3000:3000"

  alertmanager:
    ports:
      - "127.0.0.1:9093:9093"
