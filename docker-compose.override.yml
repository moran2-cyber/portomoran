version: "3.9"

# Aktif otomatis saat `docker compose up` di lokal.
# cloudflared TIDAK jalan di lokal — hanya di production.

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: portomoran:local
    ports:
      - "8080:80"
    volumes:
      - ./src:/usr/share/nginx/html:ro

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3000:3000"

  alertmanager:
    ports:
      - "9093:9093"

  # Nonaktifkan cloudflared di lokal
  cloudflared:
    profiles:
      - production
